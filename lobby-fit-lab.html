<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจขนาดหน้าเข้าเกม</title><link rel="icon" href="assets/brand69/ayothaya-emblem.png"><style>*{box-sizing:border-box}body{margin:0;background:#10241f;color:#f4e4be;font:15px/1.6 Tahoma,sans-serif}main{max-width:1450px;margin:auto;padding:16px}h1{font-size:22px;margin:0}p{margin:6px 0 14px}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:12px 0}label{display:grid;font-size:12px}select,a{min-height:44px;padding:8px;border:1px solid #b79b60;border-radius:7px;color:#ffe8b9;background:#19382e;font:inherit}a{display:flex;align-items:center}#stage{width:100%;position:relative;overflow:hidden;outline:1px solid #b79b60;background:#081d17}iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0}small{color:#c5c9a9}</style><main><h1>หน้าเข้าเกม · พอดีหน้าจอ</h1><p>ตรวจครบ 24 ขนาดจอ · 336 กรณี ไทยและอังกฤษ พรีวิวใช้หน้าและ CSS จริง โดยไม่เชื่อมบัญชี</p><nav><label>หน้าจอ<select id="size"><option>1280 × 590</option><option>844 × 390</option><option>568 × 280</option><option>320 × 480</option><option>390 × 844</option><option>430 × 932</option><option>768 × 1024</option><option>1024 × 768</option><option>1440 × 900</option><option>1920 × 1080</option><option>2560 × 1440</option></select></label><label>หน้า<select id="screen"><option value="login">บัญชี</option><option value="servers">เซิร์ฟเวอร์</option><option value="character">เลือกตัวละคร</option><option value="create">สร้างตัวละคร</option></select></label><label>สถานะบัญชี<select id="account"><option value="signed">ล็อกอินแล้ว</option><option value="anon">ยังไม่ผูก Google</option><option value="new">ผู้เล่นใหม่</option><option value="error">เชื่อมต่อไม่สำเร็จ</option></select></label><label>ภาษา<select id="lang"><option value="en">English</option><option value="th">ไทย</option></select></label><a id="full" href="/mobile-lobby-fixture.html?screen=login&lang=en">เปิดตามขนาดจอเครื่องนี้ ↗</a></nav><p><small id="scale"></small></p><div id="stage"><iframe title="พรีวิวหน้าเข้าเกม"></iframe></div></main><script type="module">const $=id=>document.getElementById(id),frame=document.querySelector('iframe');function fit(){const [w,h]=$('size').value.split(' × ').map(Number),scale=Math.min(1,$('stage').clientWidth/w);frame.width=w;frame.height=h;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';$('stage').style.height=h*scale+'px';$('scale').textContent=w+' × '+h+' · ย่อพรีวิว '+Math.round(scale*100)+'% · UI ในเฟรมใช้ความละเอียดที่เลือกจริง';}function load(){const q=new URLSearchParams({screen:$('screen').value,account:$('account').value,lang:$('lang').value});frame.src='/mobile-lobby-fixture.html?'+q;$('full').href=frame.src;fit();}document.querySelectorAll('select').forEach(s=>s.onchange=load);new ResizeObserver(fit).observe($('stage'));load();</script></html>
