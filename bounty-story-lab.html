<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ภาพเควสรายวัน · Ayothaya</title><link rel="stylesheet" href="typography.css">
<style>
html,body{margin:0;background:#0a241c;color:#f4e0b2;font:500 15px/1.7 Mali,Tahoma,sans-serif}
main{max-width:1220px;margin:auto;padding:24px}h1{font-size:27px;color:#e5c274}p{color:#c3d2bc}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.gallery article{background:#14372c;border:1px solid #b49b5c66;border-radius:7px;overflow:hidden}
.thumb{aspect-ratio:2;overflow:hidden}.thumb canvas{display:block;width:100%;height:100%}
article h2{font-size:17px;margin:12px 16px}
article button{margin:0 16px 18px;padding:8px 18px;font:700 13px Mali;color:#193127;background:#e4c47d;border:1px solid #f6dfaa;border-radius:5px;min-height:44px;cursor:pointer}
@media(max-width:800px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:14px}}
@media(max-width:480px){.gallery{grid-template-columns:1fr}}
</style></head>
<body><main id="game-shell"><h1>เรื่องราวกระดานค่าหัว · 14 เป้าหมาย</h1><p>ภาพใหม่แยกตามมอนสเตอร์ แต่ละชุดมี 3 ซีน · แตะฉากเพื่อเร่งข้อความ · กดข้ามเพื่อกลับ</p><div class="gallery"></div></main>
<script type="module">
import {BOUNTY_STORYBOARDS,bountyScene} from './bounty-storyboards163.js?v=163';
import {createQuestCinematics} from './quest-cinematic155.js?v=story163';
const game={world:{player:{hp:100,x:0,z:0},mobs:[],notice:console.info,auto:false},clearInput(){},cancelWalk(){}};
const controller=createQuestCinematics({game,account:{serverId:'lab',slotId:'bounty163'},map:{safe:true},state:()=>null});
document.querySelector('.gallery').innerHTML=Object.entries(BOUNTY_STORYBOARDS).map(([id,b])=>`<article data-target="${id}"><div class="thumb"><canvas width="640" height="320" role="img" aria-label="${b.name}"></canvas></div><h2>${b.name}</h2><button type="button">ดูคัตซีน</button></article>`).join('');
for(const article of document.querySelectorAll('[data-target]')){
 const id=article.dataset.target,scene=bountyScene({monster:id,leader:id==='leader-camp'}),img=new Image();
 img.onload=()=>{article.querySelector('canvas').getContext('2d').drawImage(img,...scene.art.frames[0],0,0,640,320);article.dataset.artState='ready';};
 img.src=scene.art.src;article.querySelector('button').onclick=()=>controller.open(scene);
}
window.__bountyLab={controller,game};
</script></body></html>
