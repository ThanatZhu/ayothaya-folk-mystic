<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>คลังอุปกรณ์ · อโยธยา</title><link rel="stylesheet" href="typography.css?v=10"><link rel="stylesheet" href="equipment-ui.css?v=41"><style>body{margin:0;background:#10261f;color:#f4dfb2;font-family:Mali,sans-serif}main{max-width:1050px;margin:0 auto;padding:24px}a{color:#e8c481}h1{font-size:28px;margin-bottom:5px}p{color:#c0c6a7;font-size:13px}label{display:inline-grid;gap:5px;margin:10px 14px 10px 0;font-size:13px}select,button{font:inherit;color:#f4dfb2;background:#203b2f;border:1px solid #b69a62;padding:8px;border-radius:5px;min-height:44px}.gallery-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;border:1px solid #b69a6266;border-radius:12px;padding:20px;margin-top:14px;background:#1a342b}.gallery-art{width:100%;max-height:410px;object-fit:contain;image-rendering:pixelated;background:radial-gradient(ellipse at center,#ae90542a,transparent 70%)}.gallery-items{display:grid;gap:8px}.gallery-items button{display:flex;align-items:center;gap:12px;text-align:left}.gallery-items button[aria-pressed=true]{background:#725a30;border-color:#efd393}.gallery-items .equipment-icon{width:48px;height:48px}h2{font-size:17px}#gallery-status{min-height:2em}@media(max-width:720px){main{padding:14px}.gallery-layout{grid-template-columns:minmax(170px,40%) 1fr;gap:10px;padding:10px}.gallery-art{height:260px}.gallery-items button{font-size:11px}}</style></head><body><main><a href="./">← กลับเข้าเกม</a><h1>คลังอุปกรณ์แห่งอโยธยา</h1><p>ลองอาวุธและชุดย้อมสีของทั้ง 8 สาย · หน้านี้เป็นห้องลอง ไม่เปลี่ยนอุปกรณ์ในบัญชี</p><label>อาชีพ<select id="gallery-class"></select></label><label>ตัวละคร<select id="gallery-gender"><option value="male">ชาย</option><option value="female">หญิง</option></select></label><label>ท่าทาง<select id="gallery-motion"><option value="idle">ยืน</option><option value="walk">เดิน</option><option value="attack">โจมตี</option><option value="guard">ตั้งรับ</option></select></label><div class="gallery-layout"><section><canvas class="gallery-art" id="gallery-art" width="320" height="320" aria-label="ตัวอย่างตัวละครกับอุปกรณ์"></canvas><p id="gallery-status" role="status"></p></section><section><h2>อาวุธ</h2><div class="gallery-items" id="gallery-weapons"></div><h2>เครื่องแต่งกาย</h2><div class="gallery-items" id="gallery-outfits"></div></section></div></main><script type="module" src="equipment-gallery.js?v=41"></script></body></html>
