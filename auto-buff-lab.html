<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัฟและตั้งค่า Auto · พรีวิว</title><link rel="stylesheet" href="typography.css"><style>html,body{margin:0;height:100%;background:#10271f;color:#fff0ce;font-family:Mali,Tahoma,sans-serif}header{box-sizing:border-box;min-height:70px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #b69655}button,select,a{font:inherit;font-size:12px;color:#fff0ce}button,select{background:#2b4936;border:1px solid #b69655;border-radius:7px;min-height:40px;padding:4px 12px}header p{margin:0;font-size:11px;color:#cfbea0}iframe{display:block;width:100%;height:calc(100dvh - 94px);border:0}a{color:#f3cf87}@media(max-width:600px){header{padding:6px;gap:6px}header p{display:none}iframe{height:calc(100dvh - 104px)}}</style><header><b>พรีวิว Auto + บัฟ</b><select id="class" aria-label="เลือกอาชีพ"><option value="swordsman">นักดาบ</option><option value="lancer">นักทวน</option><option value="hunter">นายพราน</option><option value="boxer">นักมวย</option><option value="rogue">จอมโจร</option><option value="shaman">หมอผี</option><option value="acolyte">พระ / แม่ชี</option></select><button id="skills">ดูหน้าอัปสกิล</button><button id="auto">ดูตั้งค่า Auto</button><a href="buff-gallery.html" target="_blank">ดูภาพบัฟทั้งหมด ↗</a><p>พรีวิว UI ในเครื่อง · ตัวเลขและสกิลในหน้านี้เป็นข้อมูลทดลอง ไม่กระทบตัวละครจริง</p></header><iframe id="preview" title="หน้าจอเกมสำหรับทดสอบ Auto" src="/mobile-fixture.html?class=swordsman"></iframe><script>const f=document.getElementById('preview');document.getElementById('class').onchange=e=>f.src='/mobile-fixture.html?class='+e.target.value;document.getElementById('skills').onclick=()=>f.contentWindow.dispatchEvent(new CustomEvent('open-skill-window'));document.getElementById('auto').onclick=()=>f.contentWindow.dispatchEvent(new CustomEvent('open-auto-settings'));</script></html>
