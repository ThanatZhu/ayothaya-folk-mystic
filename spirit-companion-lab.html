<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e28"><link rel="icon" href="assets/brand69/ayothaya-emblem.png" type="image/png"><title>พรายคุ้มกาย · ห้องทดลองอโยธยา</title><link rel="stylesheet" href="spirit-companion-lab.css?v=spirit-shot184"></head>
<body><main class="spirit-lab"><header class="lab-header"><a class="wordmark" href="index.html"><img src="assets/brand69/ayothaya-emblem.png" alt=""><span>AYOTHAYA<small>ห้องทดลองวิชาอาคม</small></span></a><div class="lab-title"><span class="eyebrow">หมอผี · ต้นแบบพรายคู่หู</span><h1>พรายคุ้มกาย</h1></div><button id="replay" class="replay" type="button">ดูทั้งชุดอีกครั้ง <span aria-hidden="true">↻</span></button></header>
<section id="stage" class="stage" aria-label="ลานทดลองพรายคุ้มกาย"><div class="scene-caption"><span class="live-dot"></span><span id="phase">พร้อมเรียกพราย</span></div><div class="scene-corner">ลานอาคมริมป่า<small>ภาพต้นแบบ · ค่าพลังสกิลเดิม</small></div><div id="labels" class="labels"><div id="hero-label" class="actor-label hero-label"><b>หมอผีอโยธยา</b><span>ผู้เรียกพราย</span></div><button id="target-label" class="actor-label target-label" type="button" aria-label="เลือกเป้าฝึก"><b>เป้าฝึกหมูป่า</b><i><em id="target-fill"></em></i><span id="target-hp">1,200 / 1,200</span></button></div><div id="damage-layer" class="damage-layer" aria-hidden="true"></div><div class="spell-status"><div><span id="companion-state">ยังไม่มีพรายติดตาม</span><b id="life-time">—</b></div><i><em id="life-fill"></em></i><small id="shield-status">เรียกพรายเพื่อรับโล่คุ้มกาย</small></div><div id="loading" class="loading"><img src="assets/brand69/ayothaya-emblem.png" alt=""><span id="load-status">กำลังเตรียมลานอาคม…</span></div></section>
<footer class="lab-footer"><div class="controls" aria-label="ทดลองสกิล"><button id="summon" class="primary" type="button"><span class="control-number">01</span><span><b>เรียกพราย</b><small>ปรากฏตัวจากวงยันต์</small></span></button><button id="attack" type="button" aria-pressed="false"><span class="control-number">02</span><span><b>สั่งโจมตี</b><small>ยิงลูกไฟใส่เป้าฝึก</small></span></button><button id="follow" type="button" aria-pressed="false"><span class="control-number">03</span><span><b>เดินให้พรายตาม</b><small>ลอยติดตามข้างไหล่</small></span></button><button id="reset" class="reset" type="button" aria-label="เริ่มต้นใหม่">เริ่มใหม่ ↻</button></div><p id="status" class="status" role="status">เรียกพราย แล้วกดสั่งโจมตีเพื่อดูจังหวะลูกไฟกระทบเป้าหมาย</p></footer></main><script type="module" src="spirit-companion-lab.js?v=spirit-shot184"></script></body></html>
