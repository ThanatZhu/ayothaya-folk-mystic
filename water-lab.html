essed="true">น้ำแบบใหม่</button><button id="pause" aria-pressed="false">หยุดน้ำ</button><button id="fall" hidden>ดูน้ำตก</button></nav><p class="hint">กระแสน้ำ · ระลอกคลื่น · แสงสะท้อนนุ่ม · ขอบน้ำตามรูปทรงจริง</p><p id="status" role="status">กำลังโหลดฉาก…</p></header><footer>ลากเพื่อหมุน · เลื่อนเพื่อซูม · ตัวอย่างไม่มีผลกับตัวละครหรือไอเท็ม</footer><script type="module" src="water-lab.js?v=shadow160"></script></body></html>
