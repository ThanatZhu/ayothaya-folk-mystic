<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>พรีวิว AUTO และตำแหน่งปุ่มยา</title><link rel="stylesheet" href="typography.css"><style>

</style></head><body><main><h1>ออโต้ใหม่ + ทดลองตำแหน่งยา</h1><p>ปุ่มยาขนาดเล็กใต้เมนูฝั่งขวา · ใช้ตัวละครทดสอบแยกจากบัญชีจริง</p><nav><span class="status">ตำแหน่งที่เลือก · ใต้เมนูฝั่งขวา</span><select id="device" aria-label="ขนาดหน้าจอ"><option value="844,390">มือถือ 844 × 390</option><option value="932,430">มือถือ 932 × 430</option><option value="667,375">มือถือเล็ก 667 × 375</option><option value="568,320">568 × 320</option></select></nav><div class="stage"><iframe id="game" title="ตัวอย่างเกมบนมือถือ" allow="fullscreen"></iframe></div><div id="loading" role="status">กำลังเปิดตัวละครทดสอบ…</div><p class="status" id="review-status"></p><nav class="extra"><button id="open-auto">เลือกมอนหลายชนิด</button><button id="open-combo">จัดคอมโบ</button><button id="damage">จำลอง HP / MP ต่ำ</button><button id="choose-hp">เลือกยา HP</button><button id="choose-cure">เลือกยาแก้สถานะ</button></nav><p>ทดลองกดยาได้ต่อเนื่องทุกครั้ง · ออโต้เลือกมอนหลายชนิดมีปุ่มเริ่มและตัวเลือกบอส / มินิ · ในหน้าคอมโบติ๊กสกิลแล้วใช้ลูกศรขึ้นลงเพื่อจัดลำดับ</p></main><script type="module" src="auto202-review.js?v=potion205"></script></body></html>
