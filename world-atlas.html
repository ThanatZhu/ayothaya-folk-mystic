<body><header><h1>แผนที่โลกอโยธยา</h1><nav><a href="play.html">เข้าเกม</a><a href="assets/world105/world-map.png" download="ayothaya-world-map.png">ดาวน์โหลดภาพ PNG</a><a href="assets/world105/world-map.png" target="_blank" rel="noopener">เปิดภาพเต็มขนาด</a></nav></header>
<main><figure><img src="assets/world105/world-map.png" width="1536" height="1024" alt="แผนที่โลกอโยธยา จากเมืองหลวงถึงยอดเขาไกรลาส"><figcaption>ภาพวาดแสดงเส้นทางเชื่อมระหว่างดินแดน ตำแหน่งในภาพเป็นแผนผังโลก ไม่ใช่มาตราส่วนระยะเดินจริง</figcaption></figure>
<section><h2>เส้นทางหลัก</h2><ol id="route"></ol><p id="branches"></p>
<p class="note">ทั้ง 6 ฉากตั้งแต่ป่าไผ่ผีปอบถึงยอดเขาไกรลาสเปิดให้สำรวจแล้ว มอนสเตอร์และเควสบทใหม่ยังไม่เปิด</p>
<p>ทุ่งชุมพลเข้าได้ผ่านหน้ากิลด์หรือขุนพลชุมพลเมื่อเป็นสมาชิกกิลด์ ใต้ถุนโรงสีต้องสาปเป็นดันเจี้ยนปาร์ตี้ เข้าจากโรงสีใต้เงาจันทร์</p></section></main>
<script type="module">
const catalog=await fetch('maps/world.json?v=105.0').then(r=>r.json());
const ids=['ayutthaya','rice-fields','old-orchard','moonlit-mill','lotus-marsh','bamboo-grove','ruined-temple','lablae','himmapan-edge','naga-cave','kailash-peak'];
for(const id of ids){const li=document.createElement('li');li.textContent=catalog.maps.find(m=>m.id===id)?.name??id;document.querySelector('#route').append(li);}
</script></body></html>
